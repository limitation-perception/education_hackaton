<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<meta name="color-scheme" content="light dark">
<title>ЄУніверситет у Дії — клікабельний прототип</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--page:#D9DBDF;--bg:#E9EBEE;--card:#FFFFFF;--ink:#0B0B0C;--muted:#5F6570;--line:#E3E5E8;--chip:#E9EBEE;
--btn:#0B0B0C;--btn-ink:#FFFFFF;--btn2:#FFFFFF;--btn2-ink:#0B0B0C;
--t-blue:#DCE7FA;--t-pink:#F8DFE6;--t-green:#DFF1E2;--t-yellow:#F8EDCB;--yink:#4A3B0F;
--stu:#D6E4F7;--stu-ink:#33475F;
--ok-bg:#E1F3E8;--ok-ink:#17643A;--ok:#1E8E4E;--warn-bg:#FFF1D6;--warn-ink:#6B4300;--warn:#C98A00;
--seg:#D9D9DE;--seg-ink:#33353A;--promo:#0B0B0C;--promo-ink:#FFFFFF;--promo-muted:#D0D3D9;--danger:#B3261E;
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--page:#000000;--bg:#111214;--card:#1C1D20;--ink:#F2F3F5;--muted:#A3A8B1;--line:#2C2E33;--chip:#2A2C31;
--btn:#F2F3F5;--btn-ink:#0B0B0C;--btn2:#26282C;--btn2-ink:#F2F3F5;
--t-blue:#24344F;--t-pink:#4A2A35;--t-green:#24402B;--t-yellow:#4A4020;--yink:#F2DFA6;
--stu:#22344D;--stu-ink:#B9CCE4;
--ok-bg:#153A28;--ok-ink:#86D9A8;--ok:#2FB36B;--warn-bg:#4A3812;--warn-ink:#F2C879;--warn:#E0A526;
--seg:#26282C;--seg-ink:#C7CAD0;--promo:#F2F3F5;--promo-ink:#0B0B0C;--promo-muted:#3D4148;--danger:#FF8A80;
}
}
:root[data-theme="dark"]{
--page:#000000;--bg:#111214;--card:#1C1D20;--ink:#F2F3F5;--muted:#A3A8B1;--line:#2C2E33;--chip:#2A2C31;
--btn:#F2F3F5;--btn-ink:#0B0B0C;--btn2:#26282C;--btn2-ink:#F2F3F5;
--t-blue:#24344F;--t-pink:#4A2A35;--t-green:#24402B;--t-yellow:#4A4020;--yink:#F2DFA6;
--stu:#22344D;--stu-ink:#B9CCE4;
--ok-bg:#153A28;--ok-ink:#86D9A8;--ok:#2FB36B;--warn-bg:#4A3812;--warn-ink:#F2C879;--warn:#E0A526;
--seg:#26282C;--seg-ink:#C7CAD0;--promo:#F2F3F5;--promo-ink:#0B0B0C;--promo-muted:#3D4148;--danger:#FF8A80;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:'Onest','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:560px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.screen{flex-grow:1;display:flex;flex-direction:column;gap:20px;padding:28px 24px 32px}
.head{display:flex;flex-direction:column;gap:16px}
.hgroup{display:flex;flex-direction:column;gap:8px}
.h1{margin:0;font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.5px}
.h1.m{font-size:30px;line-height:38px}
.h2{margin:4px 0 0;font-size:20px;line-height:26px;font-weight:700}
.h3{margin:0;font-size:18px;line-height:24px;font-weight:700}
.sub{font-size:15px;line-height:22px;color:var(--muted)}
.small{font-size:13px;line-height:18px;color:var(--muted)}
.lbl{font-size:14px;line-height:20px;font-weight:600;color:var(--muted)}
.back{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink)}
.card{background:var(--card);border-radius:24px}
.cl{background:var(--card);border-radius:28px;padding:20px}
.gap8{display:flex;flex-direction:column;gap:8px}
.gap10{display:flex;flex-direction:column;gap:10px}
.gap12{display:flex;flex-direction:column;gap:12px}
.gap14{display:flex;flex-direction:column;gap:14px}
.gap16{display:flex;flex-direction:column;gap:16px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.search{height:52px;background:var(--card);border-radius:20px;display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);flex:1;min-width:0}
.promo{display:block;width:100%;text-align:left;border:0;background:var(--promo);color:var(--promo-ink);border-radius:28px;padding:24px}
.promo .badge{display:inline-block;background:var(--promo-ink);color:var(--promo);font-size:12px;line-height:16px;font-weight:600;padding:6px 10px;border-radius:12px}
.promo .pt{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.5px;margin-top:16px}
.promo .pd{font-size:16px;line-height:24px;color:var(--promo-muted);margin-top:8px}
.promo .go{margin-top:20px;height:52px;border-radius:18px;background:var(--promo-ink);color:var(--promo);display:flex;align-items:center;justify-content:center;font-weight:600}
.list{background:var(--card);border-radius:24px;padding:4px 16px}
.li{display:flex;align-items:center;gap:14px;height:64px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .tx{flex:1;font-size:16px;font-weight:600}
.li .mut{color:var(--muted);display:flex}
.tile{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#0B0B0C;font-size:20px;font-weight:700}
.tile.s{width:44px;height:44px;border-radius:14px}
.t-blue{background:var(--t-blue)}.t-pink{background:var(--t-pink)}.t-green{background:var(--t-green)}.t-yellow{background:var(--t-yellow)}
:root[data-theme="dark"] .tile{color:#F2F3F5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile{color:#F2F3F5}}
.lrow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--card);border-radius:24px;padding:16px;text-align:left}
.lrow .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.lrow .tt{font-size:17px;line-height:24px;font-weight:600}
.lrow .ts{font-size:14px;line-height:20px;color:var(--muted)}
.lrow .mut{color:var(--muted);display:flex}
.stu{display:flex;flex-direction:column;gap:18px;width:100%;text-align:left;border:0;background:var(--stu);color:var(--ink);border-radius:28px;padding:20px}
.stu .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;line-height:20px;font-weight:600;color:var(--stu-ink)}
.stu .wp{display:inline-flex;align-items:center;gap:4px;background:var(--card);color:var(--ink);font-size:12px;line-height:16px;font-weight:600;padding:5px 8px 5px 10px;border-radius:10px}
.stu .mid{display:flex;gap:16px;align-items:center}
.stu .ph{width:72px;height:88px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--stu-ink);flex-shrink:0}
.stu .nm{font-size:20px;line-height:26px;font-weight:700}
.stu .sp{font-size:15px;line-height:21px}
.stu .cr{font-size:15px;line-height:21px;color:var(--stu-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:6px 10px;font-size:13px;line-height:16px;font-weight:600;align-self:flex-start}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.neutral{background:var(--chip);color:var(--ink)}
.pill.big{border-radius:14px;padding:10px 14px;font-size:14px;line-height:20px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--ok);display:inline-block;flex-shrink:0}
.pill.warn .dot{background:var(--warn)}
.okdot{width:24px;height:24px;border-radius:12px;background:var(--ok);color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .b{flex:1;display:flex;flex-direction:column}
.ck .b span:first-child{font-size:15px;line-height:21px;font-weight:600}
.ck .b span:last-child{font-size:13px;line-height:18px;color:var(--muted)}
.ck.slim{height:56px;padding:0}
.ck.slim .b{flex-direction:row;justify-content:space-between;align-items:center}
.ck.slim .b span:first-child{font-weight:500}
.ck.slim .b span:last-child{font-size:13px}
.btn,.btn2{height:56px;border:0;border-radius:20px;font-size:16px;font-weight:600;width:100%}
.btn{background:var(--btn);color:var(--btn-ink)}
.btn2{background:var(--btn2);color:var(--btn2-ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.sm,.btn2.sm{height:44px;border-radius:14px;font-size:14px}
.btn2.mini{height:40px;width:auto;padding:0 16px;border-radius:14px;font-size:14px;background:var(--chip);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 18px;border:0;border-radius:16px;font-size:15px;font-weight:600;background:var(--card);color:var(--ink)}
.chip.on{background:var(--btn);color:var(--btn-ink)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:22px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right}
.qrbtn{border:0;background:#FFFFFF;border-radius:16px;padding:10px;display:flex}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:4px}
.qrbox .cap{font-size:14px;line-height:20px;color:var(--muted);text-align:center;max-width:270px}
.note{display:flex;align-items:flex-start;gap:12px;padding:0 4px;color:var(--muted);font-size:14px;line-height:20px}
.note svg{flex-shrink:0;margin-top:1px}
.consent{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--card);border-radius:24px}
.consent input{width:24px;height:24px;margin:0;accent-color:var(--btn);flex-shrink:0}
.consent label{font-size:15px;line-height:22px}
.step{display:flex;align-items:center;gap:12px;font-size:15px;line-height:21px;color:var(--muted)}
.step.on{color:var(--ink);font-weight:600}
.step .num{width:24px;height:24px;border-radius:12px;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.step.on .num{background:var(--btn);color:var(--btn-ink)}
.seg{background:var(--seg);border-radius:18px;padding:4px;display:flex;gap:4px}
.seg button{flex:1;height:44px;border:0;border-radius:14px;background:transparent;color:var(--seg-ink);font-size:15px;font-weight:600}
.seg button.on{background:var(--card);color:var(--ink)}
.active{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--promo);color:var(--promo-ink);border-radius:24px;padding:16px;text-align:left}
.active .tile{background:var(--promo-ink);color:var(--promo)}
.active .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.active .a1{font-size:13px;line-height:18px;color:var(--promo-muted)}
.active .a2{font-size:17px;line-height:24px;font-weight:600}
.offer{padding:16px;display:flex;flex-direction:column;gap:14px}
.offer .oh{display:flex;align-items:center;gap:12px}
.offer .o1{font-size:17px;line-height:24px;font-weight:600}
.offer .o2{font-size:14px;line-height:20px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--chip);border-radius:10px;padding:6px 10px;font-size:13px;line-height:16px;font-weight:500}
.tag.ok{background:var(--ok-bg);color:var(--ok-ink);font-weight:600}
.ycard{background:var(--t-yellow);color:var(--yink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.ycard .r{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ycard .r span:first-child{font-size:15px;line-height:22px;font-weight:600}
.ycard .r span:last-child{font-size:24px;line-height:30px;font-weight:700;color:var(--ink)}
.bar{height:10px;border-radius:5px;background:var(--card);overflow:hidden}
.bar i{display:block;height:10px;border-radius:5px;background:var(--ink)}
.entry{padding:16px;display:flex;flex-direction:column;gap:10px}
.entry .er{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:16px;line-height:22px}
.entry .er b{font-weight:700;flex-shrink:0}
.entry .er span{font-weight:600}
.tabs{position:sticky;bottom:0;height:88px;flex-shrink:0;background:var(--card);border-radius:24px 24px 0 0;display:flex;justify-content:space-around;align-items:center;padding:0 16px 12px}
.tab{border:0;background:transparent;width:88px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.tab.on{color:var(--ink);font-weight:600}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:var(--seg);position:relative;flex-shrink:0}
.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:12px;background:var(--card);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--btn)}
.sw[aria-checked="true"] i{transform:translateX(20px);background:var(--btn-ink)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{width:100%;max-width:430px;background:var(--card);border-radius:28px 28px 0 0;padding:24px;display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:18px;background:var(--bg);border:2px solid transparent;text-align:left;font-size:16px;font-weight:600}
.opt.on{border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600;color:var(--muted)}
.field input{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.err{font-size:13px;line-height:18px;color:var(--danger);min-height:18px}
.doc{position:fixed;inset:0;z-index:100;background:var(--card);display:flex;align-items:center;justify-content:center}
.doc h1{margin:0;font-size:clamp(56px,16vw,180px);line-height:1;font-weight:700;letter-spacing:-.03em}
.doc .back{position:absolute;top:24px;left:24px;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:14px;line-height:20px;font-weight:600;max-width:calc(100vw - 48px);opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
#nores{display:none;text-align:center;color:var(--muted);font-size:15px}
.roles{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px 12px;background:var(--page);border-bottom:1px solid var(--line)}
.roles:empty{display:none}
.roles .rl{font-size:13px;line-height:18px;color:var(--muted);font-weight:600}
.roles button{height:36px;padding:0 14px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font-size:14px;font-weight:600}
.roles button.on{background:var(--btn);color:var(--btn-ink)}
.app.wide{max-width:1040px}
.portal{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.portal .pl{font-size:18px;line-height:24px;font-weight:700}
.portal .pc{font-size:14px;line-height:20px;color:var(--muted)}
.biz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:24px;flex-grow:1;align-content:start}
.bnav{display:flex;flex-direction:column;gap:6px;align-self:start;align-content:flex-start}
.bnav button{border:0;background:transparent;text-align:left;padding:10px 14px;border-radius:14px;font-size:15px;font-weight:600;color:var(--muted)}
.bnav button.on{background:var(--card);color:var(--ink)}
@media (max-width:760px){.biz{grid-template-columns:1fr;padding:16px}.bnav{flex-direction:row;flex-wrap:wrap}}
.bmain{display:flex;flex-direction:column;gap:20px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--card);border:0;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:6px;text-align:left}
.stat b{font-size:28px;line-height:34px}
.stat span{font-size:14px;line-height:20px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tbl{width:100%;border-collapse:collapse;font-size:15px;line-height:21px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:12px 8px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:13px;color:var(--muted);font-weight:600}
.field select{height:52px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--btn)}
.cl .chip{background:var(--chip)}
.cl .chip.on{background:var(--btn);color:var(--btn-ink)}
.push{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.push .pt{display:flex;justify-content:space-between;font-size:13px;line-height:18px;color:var(--muted)}
.btn.inl,.btn2.inl{width:auto;height:44px;padding:0 18px;border-radius:14px;font-size:14px}
.btn2.inl{background:var(--chip);color:var(--ink)}
.okdot.wait{background:var(--chip);color:var(--muted)}
.doclink{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:0;background:var(--chip);color:var(--ink);border-radius:12px;padding:6px 10px;font-size:13px;line-height:18px;font-weight:600;text-align:left}
.cl .doclink,.card .doclink{background:var(--bg)}
.docpage{width:100%;max-width:720px;margin:0 auto}
.ck .doclink{flex-shrink:0}
a.doclink{text-decoration:none}
.price{font-size:26px;line-height:32px;font-weight:700}
.prt{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.prt:last-child{border-bottom:0}
.prt b{font-size:15px;line-height:22px}
.prt span{font-size:14px;line-height:20px;color:var(--muted)}
.sub a{color:var(--ink);font-weight:600}
.roles .mini-demo{height:30px;padding:0 10px;font-size:12px;background:transparent;border:1px solid var(--line)}
.app.full{max-width:none;background:var(--page);border:0}
.demo{display:flex;gap:12px;padding:12px;height:100vh;min-height:560px}
.demo iframe{border:0;border-radius:24px;background:var(--bg);height:100%}
/* Дві рівні половини */
.demo .l,.demo .r{flex:1 1 0;min-width:0}
@media (max-width:900px){.demo{flex-direction:column;height:auto}.demo iframe{height:760px}.demo .l{width:100%}}
</style>
</head>
<body>
<nav class="roles" id="roles" aria-label="Роль у демо"></nav>
<div class="app" id="app"></div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const svg=(d,s=24,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;

window.addEventListener('storage',e=>{

if(s.type==='cat'){
body=`<div class="h3">Підстава для стипендії</div><div class="gap8">${CATS.map((c,i)=>`<button class="opt ${i===S.cat?'on':''}" data-act="pickCat" data-arg="${i}" role="radio" aria-checked="${i===S.cat}">${c.t}</button>`).join('')}</div>`;

}else if(s.type==='exchange'){
body=`<div class="h3">Передати заявку в міжнародний відділ?</div><div class="sub">Відділ побачить ваш профіль з ЄДЕБО: університет, спеціальність і курс. Документи для конкурсу завантажувати не потрібно.</div><button class="btn" data-act="sendExchange">Надіслати заявку</button><button class="btn2" style="background:var(--chip)" data-act="close">Скасувати</button>`;

<div class="field"><label for="f-title">Що зроблено</label><input id="f-title" type="text" maxlength="80" placeholder="Наприклад, код-рев'ю модуля"></div>

function route(){return (location.hash||'#/services').replace('#/','')||'services'}
function render(){
const r=route();const isDoc=r.startsWith('doc/');const fn=r==='demo'?demoHtml:isDoc?()=>docView(r.slice(4)):(R[r]||R.services);
try{app.innerHTML=fn()}catch(err){
// Помилку видно на екрані й у консолі — жодних «мовчазних» порожніх станів
console.error(err);
app.innerHTML=`<div class="screen"><div class="head">${back(S.last)}<h1 class="h1 m">Щось пішло не так</h1></div><div class="cl gap8" role="alert"><div class="h3">${esc(err.message)}</div><div class="sub">Поверніться назад і спробуйте ще раз</div></div></div>`;
}
document.getElementById('roles').innerHTML=rolesHtml(r);
const org=x=>x.startsWith('biz')||x.startsWith('school');
app.classList.toggle('wide',org(r)||(isDoc&&org(S.last.slice(2))));
app.classList.toggle('full',r==='demo');
layer.innerHTML=sheetHtml();
if(!isDoc&&r!=='demo')S.last='#/'+(R[r]?r:'services');
document.body.style.overflow=S.sheet?'hidden':'';
if(S.sheet&&S.sheet.type==='entry'){const i=document.getElementById('f-title');if(i)i.focus()}
if(r!=='demo')save();
}
function act(a,arg,el){
switch(a){
case 'rcp':S.rcp=+arg;render();break;
case 'sheet':S.sheet={type:arg,id:el.dataset.id};render();break;
case 'close':S.sheet=null;render();break;
case 'pickCat':S.cat=+arg;S.sheet=null;render();break;
case 'submit':if(!S.consent)return;S.submitted=true;S.submittedAt=nowIso();render();window.scrollTo(0,0);toast('Заяву подано');break;
case 'cancelApp':S.submitted=false;render();toast('Заяву скасовано');break;
case 'dualTab':S.dualTab=+arg;render();break;
case 'sendApply':{const id=S.sheet.id;if(!S.applied.includes(id)){S.applied.push(id);const bo=S.bizOffers.find(o=>o.id===id);if(bo){S.apps.push({id:'o-'+id,offerId:id,name:OLENA.name,school:OLENA.school,spec:OLENA.spec,course:OLENA.course,minor:false,status:'new',self:true,createdAt:nowIso()});notify('biz',`Нова заявка від ${OLENA.name} на «${bo.role}»`)}}S.sheet=null;render();toast('Заявку надіслано компанії');break}
case 'saveEntry':{
const t=document.getElementById('f-title').value.trim();
const h=parseInt(document.getElementById('f-hours').value,10);
const er=document.getElementById('f-err');
if(!t){er.textContent='Опишіть, що ви зробили';return}
if(!(h>=1&&h<=24)){er.textContent='Вкажіть кількість годин від 1 до 24';return}
S.entries.push({id:S.nextId++,title:t,hours:h,ok:false,createdAt:nowIso()});notify('biz',`${OLENA.name} додала запис у журнал: ${h} год`);S.sheet=null;render();toast('Запис додано, очікує наставника');break}
case 'mentorOk':{const e=S.entries.find(x=>x.id===+arg);if(!e)throw new Error('Запис не знайдено: '+arg);e.ok=true;e.q=false;e.confirmedAt=nowIso();notify('student',`Наставник підтвердив ${e.hours} год`);render();toast('Години підтверджено — студент і компанія це бачать');break}
case 'mentorAsk':{const e=S.entries.find(x=>x.id===+arg);if(!e)throw new Error('Запис не знайдено: '+arg);e.q=true;notify('student','Наставник просить уточнити запис у журналі');render();toast('Студенту надіслано запит на уточнення');break}
case 'createOffer':{
const role=document.getElementById('n-role').value.trim();
const places=parseInt(document.getElementById('n-places').value,10);
const hours=parseInt(document.getElementById('n-hours').value,10);
const er=document.getElementById('n-err');
if(!role){er.textContent='Вкажіть посаду';return}
if(!(places>=1&&places<=50)){er.textContent='Кількість місць — від 1 до 50';return}
if(!(hours>=4&&hours<=30)){er.textContent='Годин на тиждень — від 4 до 30';return}
S.bizOffers.push({id:'ts-'+S.nextId++,role,spec:SPECS[+document.getElementById('n-spec').value],course:+document.getElementById('n-course').value,places,hours,paid:document.getElementById('n-paid').checked,mentor:document.getElementById('n-mentor').value,status:'review',createdAt:nowIso()});notify('school',`${COMPANY.name} надіслала пропозицію «${role}» на погодження`);
location.hash='#/biz/offers';toast('Пропозицію надіслано на погодження кафедрі');break}
case 'approveOffer':{const o=S.bizOffers.find(x=>x.id===arg);if(!o)throw new Error('Пропозицію не знайдено: '+arg);o.status='approved';o.approvedAt=nowIso();notify('biz',`Кафедра погодила пропозицію «${o.role}»`);notify('student',`Нова пропозиція для вашої спеціальності: ${o.role}`);render();toast('Кафедра погодила — пропозиція вже в Дії студентів');break}
case 'acceptApp':{const a=S.apps.find(x=>x.id===arg);if(!a)throw new Error('Заявку не знайдено: '+arg);a.status='accepted';if(a.self)notify('student',`${COMPANY.name} прийняла вашу заявку — підпишіть угоду`);notify('school',`Нова угода з ${a.name} чекає підпису закладу`);
S.agreements.push({id:'g'+S.nextId++,appId:a.id,name:a.name,school:a.school,offerId:a.offerId,minor:a.minor,self:!!a.self,signs:{student:false,parent:false,company:false,school:false}});
location.hash='#/biz/agreements';toast('Угоду сформовано з даних ЄДЕБО та ЄДР');break}
case 'rejectApp':{const a=S.apps.find(x=>x.id===arg);if(!a)throw new Error('Заявку не знайдено: '+arg);a.status='rejected';if(a.self)notify('student',`${COMPANY.name} відхилила вашу заявку`);render();toast('Заявку відхилено, студент побачить це в Дії');break}
case 'sign':{const [id,k]=arg.split(':');const g=S.agreements.find(x=>x.id===id);if(!g)throw new Error('Угоду не знайдено: '+id);g.signs[k]=nowIso();if(k==='company'){if(g.self)notify('student',`${COMPANY.name} підписала угоду КЕП`);notify('school',`${COMPANY.name} підписала угоду з ${g.name}`)}if(k==='school'){if(g.self)notify('student','Заклад освіти підписав угоду');notify('biz',`Заклад підписав угоду з ${g.name}`)}render();toast(isActive(g)?'Усі сторони підписали — угода активна':'Підпис додано');break}
case 'signSelf':{const g=S.agreements.find(x=>x.id===arg);if(!g)throw new Error('Угоду не знайдено: '+arg);g.signs.student=nowIso();notify('biz',`${g.name} підписала угоду Дія.Підписом`);notify('school',`${g.name} підписала угоду Дія.Підписом`);render();toast(isActive(g)?'Угода активна':'Підписано Дія.Підписом — чекаємо компанію й заклад');break}
case 'signAct':S.actSigned=nowIso();notify('school',`${COMPANY.name} підписала акт за вересень`);render();toast('Акт підписано — заклад бачить підтверджені години');break;
case 'grade':{const [i,j]=arg.split(':').map(Number);S.assess[i]=j;S.assessErr='';render();break}
case 'sendAssess':if(S.assess.some(x=>x===null)){S.assessErr='Оцініть усі результати навчання';render();return}S.assessSent=nowIso();notify('school',`${COMPANY.name} надіслала оцінку семестру`);render();toast('Оцінку надіслано куратору');break;
case 'sendExchange':S.exchangeApplied=nowIso();S.sheet=null;render();toast('Заявку передано в міжнародний відділ (прототип)');break;
case 'demoCycle':startDemoCycle();break;
case 'shareDual':S.rcp=EMPLOYER_RCP;location.hash='#/certificate';break;
case 'creditDo':S.creditedAt=nowIso();notify('student','Куратор зарахував дуальну частину — результат уже в ЄДЕБО');render();toast('Зараховано, результат передано в ЄДЕБО');break;
case 'credit':S.credit=true;S.creditAt=nowIso();notify('school',`${OLENA.name} просить зарахувати дуальну частину`);render();toast('Запит на зарахування надіслано куратору');break;
case 'share':toast('Посилання на перевірку скопійовано (прототип)');break;
case 'stub':toast('У прототипі відкривається лише ЄУніверситет');break;
case 'theme':document.documentElement.dataset.theme=isDark()?'light':'dark';render();break;
}
}
document.addEventListener('click',e=>{
if(e.target.matches('[data-backdrop]')){S.sheet=null;render();return}
const g=e.target.closest('[data-go]');
if(g){e.preventDefault();location.hash=g.dataset.go;return}
const a=e.target.closest('[data-act]');
if(a)act(a.dataset.act,a.dataset.arg,a);
});
document.addEventListener('change',e=>{if(e.target.id==='consent'){S.consent=e.target.checked;render()}});
document.addEventListener('input',e=>{
if(e.target.id==='q'){
const v=e.target.value.trim().toLowerCase();let n=0;
document.querySelectorAll('[data-search]').forEach(el=>{const m=!v||el.dataset.search.includes(v);el.style.display=m?'':'none';if(m)n++});
document.getElementById('nores').style.display=n?'none':'block';
}
if(e.target.closest('.sheet')){const er=document.getElementById('f-err');if(er)er.textContent=''}
});
document.addEventListener('keydown',e=>{
if(e.key!=='Escape')return;
if(S.sheet){S.sheet=null;render()}else if(route().startsWith('doc/')){location.hash=S.last}
});
window.addEventListener('hashchange',()=>{S.sheet=null;window.scrollTo(0,0);render()});
if(!location.hash)history.replaceState(null,'','#/services');
load();
render();
</script>
</body>
</html>
